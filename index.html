<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>controlesaude</title>
    <main class="max-w-6xl mx-auto p-6">
      <h2 class="text-3xl font-bold text-slate-800 mb-6">
        Pacientes
      </h2>
      <input type="text"
              placeholder="Digite o nome do paciente..."
              class="w-full p-4 bg-white border border-slate-300 rounded-xl
              outline-none
              placeholder:text-slate-400
              placeholder: italic
              focus: border-blue-500">
      <div class="group bg--white rounded-2xl p-6 shadow-sm
            border border-slate-200 hover: shadow-lg transition">
        <div class="flex items-center gap-4">
          <!--O grupo-hover:scale aumenta o tamanho do elemento-->
          <div class="w-16 h-16 bg-blue-100 rounded-full
          flex items-center justify-center
          text-3xl transition
          group-hover:scale-110">
          🐶
          </div>
          <div>
            <h3 class="text-xl font-bold text-slate-800
            group-hover:text-blue-600 transition">
            Luna
            </h3>
            <p class="text-slate-500"> 
              Bulldog * 4 anos
            </p>
          </div>
        </div>
      </div>
    </main>
  </head>
  <body class="bg-slate-100 min-h-screen">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
